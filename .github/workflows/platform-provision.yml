name: "Enterprise Platform Deployment Pipeline"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose whether to Deploy or Destroy the entire infrastructure'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: "Orchestrate AWS Infrastructure"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform Core Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # EXPERT PATTERN: Initialize with a local backend first if bucket doesn't exist,
      # then migrate the state to S3 seamlessly using partial configuration flags.
      # This completely bypasses the chicken-and-egg problem natively!
      幕 - name: Production-Grade Backend Initialization
        run: |
          cd infrastructure/terraform/environments/dev
          
          echo "Checking if remote S3 infrastructure state bucket exists..."
          if ! aws s3api head-bucket --bucket prasad-ops-tfstate-bucket 2>/dev/null; then
            echo "Bucket not found. Bootstrapping state bucket natively via AWS CLI engine..."
            aws s3api create-bucket --bucket prasad-ops-tfstate-bucket --region us-east-1
            aws s3api put-bucket-encryption --bucket prasad-ops-tfstate-bucket --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
            
            echo "Creating high-availability distributed state locking table..."
            aws dynamodb create-table \
              --table-name terraform-lock-table \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --provisioned-throughput ReadCapacityUnits=1,WriteCapacityUnits=1 \
              --region us-east-1
              
            echo "Waiting for DynamoDB indexing tables to settle..."
            aws dynamodb wait table-exists --table-name terraform-lock-table
          fi

          # Standard production-grade backend initialization
          terraform init -input=false

      - name: Validate IaC Integrity
        run: |
          cd infrastructure/terraform/environments/dev
          terraform validate

      - name: Execute Terraform Operational Run
        run: |
          cd infrastructure/terraform/environments/dev
          if [ "${{ github.event.inputs.action }}" == "apply" ]; then
            terraform apply -auto-approve -input=false
          else
            # Explicitly cleanup resources first, keeping the state bucket intact for tracking
            terraform destroy -auto-approve -input=false
          fi

  gitops-sync:
    name: "Bootstrap GitOps Engine"
    needs: infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'apply'
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Connect context to new AWS EKS Cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name enterprise-platform-eks-dev

      - name: Install & Bootstrap ArgoCD Engine
        run: |
          kubectl create namespace argocd || true
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          
          echo "Waiting for ArgoCD API Server readiness..."
          kubectl wait --namespace argocd --for=condition=ready pod -l app.kubernetes.io/name=argocd-server --timeout=300s

      - name: Apply Declarative Platform Application Link
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            kubectl apply -f argocd/environments/prod-app.yaml
          else
            kubectl apply -f argocd/environments/dev-app.yaml
          fi
          echo "GitOps Engine linked successfully. Microservices convergence initiated."